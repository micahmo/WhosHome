name: Publish Docker Image

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v5

    # Tests run before anything is published. They encode the presence scenarios that have actually
    # happened, so a rule added for one of them cannot quietly undo another.
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Test
      run: dotnet test WhosHome.Tests/WhosHome.Tests.csproj

    # Build
    - name: Build image
      run: |
        [[ $GITHUB_REF_NAME = "main" ]] && TAG="latest" || TAG=$GITHUB_REF_NAME
        TAG="${TAG//\//$'-'}"
        docker build . --file Dockerfile --tag ghcr.io/"${GITHUB_REPOSITORY,,}":$TAG

    # Push
    - name: Push image
      run: |
        [[ $GITHUB_REF_NAME = "main" ]] && TAG="latest" || TAG=$GITHUB_REF_NAME
        TAG="${TAG//\//$'-'}"
        echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u $GITHUB_REPOSITORY_OWNER --password-stdin
        docker push ghcr.io/"${GITHUB_REPOSITORY,,}":$TAG
