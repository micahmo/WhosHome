<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) actually do anything. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Who's Home</title>
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Android has no way for a standalone web app to draw under the system bars, so the next
         best thing is colouring them to match the page. One fixed colour meant a near-black
         status bar above a white page in light mode, which is what reads as a black bar. These
         override the manifest's single theme_color per scheme. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)" />

    <!-- iOS predates the manifest standard and still needs its own tags to launch
         full screen from the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Who's Home" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
