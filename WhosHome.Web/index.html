<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) actually do anything. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Who's Home</title>
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Matches the app, which is dark only. See the comment in app.css for why. -->
    <meta name="theme-color" content="#121214" />
    <meta name="color-scheme" content="dark" />

    <!-- iOS predates the manifest standard and still needs its own tags to launch
         full screen from the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Who's Home" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
